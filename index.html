<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TOOLPICK</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

:root{
    --bg:#08090b;
    --panel:#101216;
    --border:#242832;
    --text:#f5f7fa;
    --sub:#8d949f
}

body{
    font-family:Arial,"Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:78px;
    background:#0b0c0f;
    border-right:1px solid #20232a;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 0;
    z-index:1000
}

.logo{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#000;
    color:#fff;
    border:1px solid #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:20px;
    margin-bottom:24px
}

.side-menu{
    display:flex;
    flex-direction:column;
    gap:9px;
    width:100%;
    align-items:center
}

.side-btn{
    position:relative;
    width:48px;
    height:48px;
    border:0;
    background:transparent;
    color:#777e89;
    border-radius:14px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.2s
}

.side-btn svg{
    width:22px;
    height:22px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.8
}

.side-btn:hover,
.side-btn.active{
    color:#fff;
    background:#1a1a1a
}

.side-btn::after{
    content:attr(data-tooltip);
    position:absolute;
    left:60px;
    top:50%;
    transform:translateY(-50%);
    background:#20232a;
    color:#fff;
    font-size:12px;
    white-space:nowrap;
    padding:7px 10px;
    border-radius:7px;
    opacity:0;
    pointer-events:none;
    transition:.15s;
    border:1px solid #30343c;
    z-index:2000
}

.side-btn:hover::after{
    opacity:1
}

/* ================= MAIN ================= */

.main{
    margin-left:78px;
    min-height:100vh;
    padding:38px
}

.page{
    display:none;
    animation:pageIn .25s ease
}

.page.active{
    display:block
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(7px)
    }

    to{
        opacity:1;
        transform:translateY(0)
    }
}

.header{
    margin-bottom:30px
}

.header h1{
    font-size:32px;
    letter-spacing:-1px
}

.header p{
    color:var(--sub);
    margin-top:8px
}

/* ================= HOME ================= */

.tools-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
    gap:16px
}

.tool-card{
    background:
        linear-gradient(145deg,#111318,#0e1013);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px;
    min-height:170px;
    cursor:pointer;
    transition:.25s
}

.tool-card:hover{
    transform:translateY(-4px);
    border-color:#3a3f49;
    background:#15171c
}

.tool-icon{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#1c1f25;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px
}

.tool-icon svg{
    width:22px;
    height:22px;
    stroke:#fff;
    fill:none;
    stroke-width:1.8
}

.tool-card h3{
    font-size:17px;
    margin-bottom:7px
}

.tool-card p{
    color:#858c97;
    font-size:13px
}

/* ================= COMMON ================= */

.panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:25px
}

textarea,
input,
select{
    width:100%;
    background:#0b0d10;
    color:#fff;
    border:1px solid #292d35;
    outline:none;
    border-radius:11px;
    padding:12px;
    font-size:14px
}

textarea{
    min-height:130px;
    resize:vertical
}

input:focus,
textarea:focus{
    border-color:#555b66
}

button.primary{
    border:0;
    background:#f1f1f1;
    color:#08090b;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s
}

button.primary:hover{
    background:#fff;
    transform:translateY(-1px)
}

button.secondary{
    border:1px solid #30343d;
    background:#15171c;
    color:#ddd;
    padding:11px 17px;
    border-radius:10px;
    cursor:pointer
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap
}

.mt{
    margin-top:16px
}

/* ================= ROULETTE ================= */

.roulette-layout{
    display:grid;
    grid-template-columns:330px 1fr;
    gap:25px
}

.roulette-wheel-area{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:420px
}

.wheel-wrap{
    position:relative;
    width:310px;
    height:310px
}

.wheel{
    width:310px;
    height:310px;
    border-radius:50%;
    border:7px solid #272a31;
    position:relative;
    overflow:hidden;
    box-shadow:
        0 0 0 2px #0a0b0d,
        0 20px 60px rgba(0,0,0,.5);
    transition:
        transform 5.2s
        cubic-bezier(.12,.78,.15,1)
}

.wheel::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    box-shadow:
        inset 0 0 35px rgba(0,0,0,.5);
    pointer-events:none
}

/*
   룰렛 이름
   각 칸의 중앙에 표시되며
   글자는 항상 똑바로 보임
*/

.wheel-label{
    position:absolute;
    left:50%;
    top:50%;
    width:90px;
    height:30px;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:13px;
    font-weight:bold;
    text-align:center;
    white-space:nowrap;
    pointer-events:none;
    text-shadow:
        0 1px 4px rgba(0,0,0,.9);
    z-index:3
}

.pointer{
    position:absolute;
    z-index:5;
    top:-17px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:30px solid #fff;
    filter:
        drop-shadow(
            0 3px 5px rgba(0,0,0,.5)
        )
}

.wheel-center{
    position:absolute;
    z-index:6;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:60px;
    height:60px;
    background:#111318;
    border:5px solid #30343c;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold
}

.result-box{
    margin-top:20px;
    text-align:center;
    min-height:35px;
    color:#cfd4dc;
    font-size:15px
}

/* ================= TEAM ================= */

.team-result{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
    margin-top:20px
}

.team-card{
    background:#15171c;
    border:1px solid #292d35;
    border-radius:14px;
    padding:18px
}

.team-card h3{
    margin-bottom:12px
}

.team-member{
    color:#aeb4bd;
    font-size:13px;
    padding:5px 0
}

/* ================= TIMER ================= */

.timer-layout{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    min-height:570px
}

.timer-circle{
    width:330px;
    height:330px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at center,
            #0c0e11 62%,
            transparent 63%
        ),
        conic-gradient(
            #f1f1f1 var(--progress),
            #262a31 0
        );
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 0 60px rgba(255,255,255,.04),
        inset 0 0 30px rgba(0,0,0,.6)
}

.timer-inner{
    width:285px;
    height:285px;
    background:#0c0e11;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center
}

.timer-display{
    font-family:monospace;
    font-size:55px;
    letter-spacing:3px
}

.timer-status{
    color:#7e8692;
    margin-top:9px;
    font-size:13px
}

.timer-controls{
    display:flex;
    gap:10px;
    margin-top:30px
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .sidebar{
        width:64px
    }

    .logo{
        width:38px;
        height:38px;
        font-size:16px
    }

    .side-btn{
        width:42px;
        height:42px
    }

    .main{
        margin-left:64px;
        padding:22px 16px
    }

    .roulette-layout{
        grid-template-columns:1fr
    }

    .wheel-wrap,
    .wheel{
        width:280px;
        height:280px
    }

    .timer-circle{
        width:280px;
        height:280px
    }

    .timer-inner{
        width:240px;
        height:240px
    }

    .timer-display{
        font-size:42px
    }
}
</style>
</head>

<script>

/* =====================================================
   PAGE
===================================================== */

function openPage(id,btn){

    document
        .querySelectorAll(".page")
        .forEach(p=>{
            p.classList.remove("active");
        });

    const target=
        document.getElementById(id);

    if(target){
        target.classList.add("active");
    }

    document
        .querySelectorAll(".side-btn")
        .forEach(b=>{
            b.classList.remove("active");
        });

    if(btn){

        btn.classList.add("active");

    }else{

        const matching=
            document.querySelector(
                `.side-btn[onclick*="'${id}'"]`
            );

        if(matching){
            matching.classList.add("active");
        }

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   AUDIO
===================================================== */

let audioContext=null;

function getAudio(){

    if(!audioContext){

        audioContext=new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(
        audioContext.state===
        "suspended"
    ){

        audioContext.resume();

    }

    return audioContext;
}


/* 당첨 효과음만 */

function playWin(){

    const ctx=getAudio();

    const notes=[
        523.25,
        659.25,
        783.99,
        1046.5
    ];

    notes.forEach((freq,i)=>{

        const osc=
            ctx.createOscillator();

        const gain=
            ctx.createGain();

        const start=
            ctx.currentTime+
            i*.12;

        osc.type="sine";

        osc.frequency.setValueAtTime(
            freq,
            start
        );

        gain.gain.setValueAtTime(
            .0001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            .16,
            start+.02
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            start+.28
        );

        osc.connect(gain);

        gain.connect(
            ctx.destination
        );

        osc.start(start);

        osc.stop(
            start+.3
        );

    });

}


/* =====================================================
   ROULETTE
===================================================== */

let rouletteItems=[];

let rouletteRotation=0;

let rouletteSpinning=false;


/*
   룰렛 생성
   각 칸에 이름을 표시
*/

function buildRoulette(){

    const input=
        document
            .getElementById(
                "rouletteInput"
            )
            .value;

    rouletteItems=
        input
            .split("\n")
            .map(x=>x.trim())
            .filter(Boolean);

    const wheel=
        document.getElementById(
            "wheel"
        );

    wheel.innerHTML="";

    if(
        rouletteItems.length===0
    ){

        wheel.style.background=
            "#202329";

        return;

    }

    const count=
        rouletteItems.length;

    const angle=
        360/count;

    const colors=[
        "#17191e",
        "#24272e",
        "#30343c",
        "#1d2026",
        "#292d35",
        "#363b44"
    ];

    let gradient=[];

    for(
        let i=0;
        i<count;
        i++
    ){

        const start=
            i*angle;

        const end=
            (i+1)*angle;

        gradient.push(
            `${colors[i%colors.length]} ${start}deg ${end}deg`
        );

        const label=
            document.createElement(
                "div"
            );

        label.className=
            "wheel-label";

        label.innerText=
            rouletteItems[i];

        /*
           현재 칸의 중앙 각도
        */

        const middle=
            start+
            angle/2;

        /*
           이름을 룰렛 바깥쪽으로 이동하고
           글자는 다시 반대로 회전시켜
           항상 똑바로 보이게 함
        */

        label.style.transform=
            `translate(-50%,-50%)
             rotate(${middle}deg)
             translateY(-105px)
             rotate(${-middle}deg)`;

        wheel.appendChild(
            label
        );

    }

    wheel.style.background=
        `conic-gradient(
            from 0deg,
            ${gradient.join(",")}
        )`;

}


document
    .getElementById(
        "rouletteInput"
    )
    .addEventListener(
        "input",
        buildRoulette
    );


/*
   룰렛 돌리기
*/

function spinRoulette(){

    if(rouletteSpinning)
        return;

    buildRoulette();

    if(
        rouletteItems.length<2
    ){

        document
            .getElementById(
                "rouletteResult"
            )
            .innerText=
                "참가자를 2명 이상 입력해주세요.";

        return;

    }

    /*
       브라우저에서 효과음 재생 권한 확보
    */

    getAudio();

    rouletteSpinning=true;

    const wheel=
        document.getElementById(
            "wheel"
        );

    const count=
        rouletteItems.length;

    const segment=
        360/count;

    const winner=
        Math.floor(
            Math.random()*count
        );

    /*
       당첨 칸의 중앙 각도
    */

    const targetCenter=
        winner*segment+
        segment/2;

    /*
       위쪽 포인터로 이동
    */

    const desired=
        360-targetCenter;

    /*
       7바퀴 회전
    */

    rouletteRotation+=
        360*7+
        desired;

    wheel.style.transform=
        `rotate(${rouletteRotation}deg)`;

    document
        .getElementById(
            "rouletteResult"
        )
        .innerText=
            "룰렛이 돌아가는 중...";

    /*
       회전 소리는 없음.
       회전이 끝났을 때 당첨 소리만 재생.
    */

    setTimeout(()=>{

        rouletteSpinning=false;

        document
            .getElementById(
                "rouletteResult"
            )
            .innerHTML=
                `🎉 <strong>${rouletteItems[winner]}</strong> 당첨!`;

        playWin();

    },5250);

}


/*
   룰렛 초기화
*/

function clearRoulette(){

    document
        .getElementById(
            "rouletteInput"
        )
        .value="";

    document
        .getElementById(
            "rouletteResult"
        )
        .innerText=
            "결과가 여기에 표시됩니다.";

    rouletteItems=[];

    const wheel=
        document.getElementById(
            "wheel"
        );

    wheel.innerHTML="";

    wheel.style.background=
        "#202329";

}


/* =====================================================
   TEAM
===================================================== */

function shuffle(array){

    const arr=[
        ...array
    ];

    for(
        let i=arr.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*
                (i+1)
            );

        [
            arr[i],
            arr[j]
        ]=[
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


function makeTeams(){

    const people=
        document
            .getElementById(
                "teamInput"
            )
            .value
            .split("\n")
            .map(x=>x.trim())
            .filter(Boolean);

    const count=
        parseInt(
            document
                .getElementById(
                    "teamCount"
                )
                .value
        );

    if(
        people.length<count
    ){

        document
            .getElementById(
                "teamResult"
            )
            .innerHTML=
                `
                <div class="panel">
                    참가자 수가 팀 수보다 많아야 합니다.
                </div>
                `;

        return;

    }

    const shuffled=
        shuffle(people);

    const teams=[];

    for(
        let i=0;
        i<count;
        i++
    ){

        teams.push([]);

    }

    shuffled.forEach(
        (person,i)=>{

            teams[
                i%count
            ].push(person);

        }
    );

    const result=
        document.getElementById(
            "teamResult"
        );

    result.innerHTML="";

    teams.forEach(
        (team,i)=>{

            const card=
                document.createElement(
                    "div"
                );

            card.className=
                "team-card";

            let html=
                `<h3>TEAM ${i+1}</h3>`;

            team.forEach(
                person=>{

                    html+=
                        `<div class="team-member">${person}</div>`;

                }
            );

            card.innerHTML=
                html;

            result.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   TIMER
===================================================== */

let timerSeconds=300;

let timerRunning=false;

let timerInterval=null;


function updateTimerDisplay(){

    const minutes=
        Math.floor(
            timerSeconds/60
        );

    const seconds=
        timerSeconds%60;

    const m=
        String(minutes)
            .padStart(2,"0");

    const s=
        String(seconds)
            .padStart(2,"0");

    document
        .getElementById(
            "timerDisplay"
        )
        .innerText=
            `${m}:${s}`;

    const total=
        parseInt(
            document
                .getElementById(
                    "timerMinutes"
                )
                .value||5
        )*60+
        parseInt(
            document
                .getElementById(
                    "timerSeconds"
                )
                .value||0
        );

    const progress=
        total>0
        ?
        Math.max(
            0,
            Math.min(
                1,
                timerSeconds/total
            )
        )
        :
        0;

    document
        .getElementById(
            "timerCircle"
        )
        .style.setProperty(
            "--progress",
            `${progress*360}deg`
        );

}


function startTimer(){

    if(timerRunning){

        timerRunning=false;

        clearInterval(
            timerInterval
        );

        document
            .getElementById(
                "timerStart"
            )
            .innerText=
                "계속";

        document
            .getElementById(
                "timerStatus"
            )
            .innerText=
                "일시정지";

        return;

    }

    if(
        timerSeconds<=0
    ){

        const minutes=
            parseInt(
                document
                    .getElementById(
                        "timerMinutes"
                    )
                    .value||0
            );

        const seconds=
            parseInt(
                document
                    .getElementById(
                        "timerSeconds"
                    )
                    .value||0
            );

        timerSeconds=
            minutes*60+
            seconds;

    }

    if(
        timerSeconds<=0
    )
        return;

    timerRunning=true;

    document
        .getElementById(
            "timerStart"
        )
        .innerText=
            "일시정지";

    document
        .getElementById(
            "timerStatus"
        )
        .innerText=
            "진행 중";

    clearInterval(
        timerInterval
    );

    timerInterval=
        setInterval(()=>{

            timerSeconds--;

            updateTimerDisplay();

            if(
                timerSeconds<=0
            ){

                clearInterval(
                    timerInterval
                );

                timerRunning=false;

                document
                    .getElementById(
                        "timerStart"
                    )
                    .innerText=
                        "시작";

                document
                    .getElementById(
                        "timerStatus"
                    )
                    .innerText=
                        "완료";

            }

        },1000);

}


function resetTimer(){

    clearInterval(
        timerInterval
    );

    timerRunning=false;

    const minutes=
        parseInt(
            document
                .getElementById(
                    "timerMinutes"
                )
                .value||5
        );

    const seconds=
        parseInt(
            document
                .getElementById(
                    "timerSeconds"
                )
                .value||0
        );

    timerSeconds=
        Math.max(
            0,
            minutes*60+
            seconds
        );

    document
        .getElementById(
            "timerStart"
        )
        .innerText=
            "시작";

    document
        .getElementById(
            "timerStatus"
        )
        .innerText=
            "준비됨";

    updateTimerDisplay();

}


/* 시간 변경 */

document
    .getElementById(
        "timerMinutes"
    )
    .addEventListener(
        "change",
        ()=>{
            if(!timerRunning)
                resetTimer();
        }
    );

document
    .getElementById(
        "timerSeconds"
    )
    .addEventListener(
        "change",
        ()=>{
            if(!timerRunning)
                resetTimer();
        }
    );


/* =====================================================
   INITIALIZE
===================================================== */

buildRoulette();

updateTimerDisplay();

</script>
